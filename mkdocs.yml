site_name: LicenseGuard
site_description: Dependency license compliance scanning for Python projects — installed-only resolution, policy-driven risk classification, and PyPI drift detection
site_author: Shanen Thomas
site_url: https://shanen28.github.io/license-guard/

repo_name: shanen28/license-guard
repo_url: https://github.com/shanen28/license-guard
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      permalink: true
      baselevel: 2
      toc_depth: 3

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/installation.md
      - getting-started/quickstart.md
      - getting-started/first-scan.md
  - Core Concepts:
      - core-concepts/installed-only.md
      - core-concepts/license-detection.md
      - core-concepts/risk-classification.md
      - core-concepts/license-expressions.md
  - Policy:
      - policy/overview.md
      - policy/policy-file.md
      - policy/governance.md
  - CLI Reference:
      - cli/commands.md
      - cli/examples.md
  - Web Dashboard:
      - dashboard/overview.md
      - dashboard/usage.md
  - Drift Analysis:
      - drift/overview.md
      - drift/interpreting.md
  - CI/CD:
      - ci-cd/integration.md
      - ci-cd/gating.md
  - Architecture:
      - architecture/overview.md
      - architecture/design-decisions.md
  - API Reference:
      - api/python-api.md
      - api/report-schema.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md

# Anchors default to `info` and would otherwise pass silently; raising these to
# `warn` makes `mkdocs build --strict` fail on broken internal links.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
    absolute_links: warn

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      # Creation dates are disabled: git reports them unreliably for files moved
      # during the Jekyll-to-MkDocs restructure, which fails `mkdocs build --strict`.
      enable_creation_date: false
      enable_git_follow: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shanen28/license-guard
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/licenseguard/

extra_css:
  - stylesheets/extra.css
